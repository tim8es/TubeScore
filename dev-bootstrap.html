<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TubeScore Local Dev Config</title>
  </head>
  <body>
    <main>
      <h1>TubeScore Local Dev Config</h1>
      <p>This page is emitted only by the local developer build. The token is stored in chrome.storage.local and is never written into source or build files.</p>
      <label for="tmdb-token">TMDB API read token</label>
      <input id="tmdb-token" type="password" autocomplete="off" spellcheck="false" />
      <div>
        <button id="save-token" type="button">Save locally</button>
        <button id="clear-token" type="button">Clear</button>
        <button id="run-preflight" type="button">Run preflight</button>
      </div>
      <p>Preflight: <strong id="status">checking</strong></p>
    </main>
    <script src="dev-bootstrap.js"></script>
  </body>
</html>
