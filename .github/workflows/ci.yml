name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:build
      - name: Package verified TubeScore MVP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          zip -qr ../TubeScore-MVP.zip .
      - name: Verify packaged TubeScore MVP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          unzip -t TubeScore-MVP.zip
          entries="$(unzip -Z1 TubeScore-MVP.zip)"
          for file in \
            manifest.json \
            content-script.js \
            service-worker.js \
            assets/icon16.png \
            assets/icon32.png \
            assets/icon48.png \
            assets/icon128.png; do
            printf '%s\n' "$entries" | grep -Fx "$file"
          done
      - name: Upload verified TubeScore MVP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TubeScore-MVP-${{ github.sha }}
          path: TubeScore-MVP.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
