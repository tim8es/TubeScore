name: UI Visual Smoke

on:
  push:
    branches:
      - feat/youtube-native-rating-badges
    paths:
      - 'src/**'
      - 'scripts/ui-visual-smoke.mjs'
      - '.github/workflows/ui-visual-smoke.yml'
      - 'manifest.json'

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Build extension
        run: npm run build
      - name: Run Odyssey and F1 visual interaction gate
        run: xvfb-run -a node scripts/ui-visual-smoke.mjs
      - name: Upload UI visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-evidence-${{ github.sha }}
          path: ui-visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
