name: Live multilingual benchmark

on:
  push:
    branches:
      - benchmark/live-multilingual-v031
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run live multilingual benchmark
        run: npx vitest run benchmarks/live-multilingual-benchmark.test.ts --reporter=verbose
