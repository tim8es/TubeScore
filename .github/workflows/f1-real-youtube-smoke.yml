name: F1 Real YouTube Smoke

on:
  push:
    branches:
      - fix/exact-youtube-id-confidence
    paths:
      - 'src/**'
      - 'scripts/manual-user-regression-smoke.mjs'
      - '.github/workflows/f1-real-youtube-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium for smoke only
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Build unpacked extension
        run: npm run build
      - name: Run real YouTube regression gate
        run: xvfb-run -a node scripts/manual-user-regression-smoke.mjs
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-real-youtube-evidence-${{ github.sha }}
          path: manual-regression-artifacts/
          if-no-files-found: warn
          retention-days: 14
