name: Production context affected evaluator

on:
  push:
    branches:
      - research/production-context-eval-v031

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Prepare evaluator
        run: cp benchmarks/production-context-affected.test.ts tests/production-context-affected.test.ts
      - name: Run evaluator
        run: npx vitest run tests/production-context-affected.test.ts --reporter=verbose
